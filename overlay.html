<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280,initial-scale=1">
  <link rel="stylesheet" href="overlay.css">
</head>

<body>
  <div id="overlay" class="overlay show-background">
  <div class="score-wrap" aria-label="SET SCORE">
    <span id="ovLeftScore" class="score-number">0</span>
    <span id="ovRightScore" class="score-number">0</span>
  </div>
  <div id="ovLeftCode" class="value left-code"></div>
  <div id="ovLeftRule" class="value left-rule">ガチエリア</div>
  <div id="ovRightCode" class="value right-code"></div>
  <div id="ovRightRule" class="value right-rule">ガチエリア</div>
  <div id="ovRound" class="value round">1</div>
  <div id="ovGame" class="value game">1</div>
</div><script src="app.js"></script></body></html>
